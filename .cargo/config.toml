# Cargo configuration for lion-greeter.
#
# These flags apply to BOTH dev and release builds. They pin the
# baseline ISA so the optimiser can use modern instructions (AVX2,
# BMI2, FMA, SSE4.2) without breaking compatibility with hardware
# LionOS is expected to run on.
#
# `x86-64-v3` = Haswell (2013) baseline: SSE4.2, AVX2, BMI1/BMI2, FMA,
# F16C, MOVBE. This is the same baseline RHEL 9 (2022) and Fedora 40
# (2024) ship. For a "future-proof" OS released in 2026+, v3 is the
# correct floor — pre-2013 x86_64 hardware is not a realistic target.
#
# To override for a specific build:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
# or remove this file.
#
# For non-x86_64 targets (aarch64, riscv64, ...) no flags are added —
# Rust's default baseline for those architectures is already the
# architecture's baseline ISA.

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

[env]
# Default log filter — can be overridden at runtime by the unit file
# or by `RUST_LOG=...` from the shell. Setting it here means the daemon
# has a sensible default even when the unit file is overridden.
RUST_LOG = { value = "lion_greeter=info", force = false }
