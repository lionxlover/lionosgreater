[package]
name = "lion-greeter"
version = "0.6.1"
edition = "2021"
description = "LionOS login daemon: PAM authentication (conversation-forwarding, autologin), XDG session selection, logind user switching"
license = "MIT"
repository = "https://github.com/lionos-org/lion-greeter"
homepage = "https://lionos.org/"
keywords = ["lionos", "login", "pam", "greeter", "daemon"]
categories = ["authentication", "os::linux-apis"]
rust-version = "1.74"

[lib]
name = "lion_greeter"
path = "src/lib.rs"

[[bin]]
name = "lion-greeter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "4", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
thiserror = "1"
anyhow = "1"
# `release_max_level_info` compiles out `debug!`/`trace!` calls at the
# call site in release builds (dev still sees everything). Smaller
# binary, faster hot path, no churn in observability surface.
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
users = "0.11"
libc = "0.2"
zeroize = "1"

[build-dependencies]
# No build deps — the libpam link is resolved in build.rs by emitting
# a direct `-l:libpam.so.0` flag (GNU ld `:` form) so we do not need
# libpam-dev (the unversioned libpam.so symlink) installed.

[profile.release]
# Maximum optimization for a long-running root daemon.
lto = "fat"           # whole-program LTO across all crates
codegen-units = 1     # single CGU so the optimiser sees everything
panic = "abort"       # no unwind tables; smaller binary + faster panic
strip = "symbols"     # drop symbols (we keep build-id for crash reports)
opt-level = 3

[profile.dev]
opt-level = 0
debug = 1
incremental = true
