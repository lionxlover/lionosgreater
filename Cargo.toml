[package]
name = "lion-greeter"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "LionOS login backend: user enumeration, PAM authentication, session launch (spec 01)"
license = "MIT OR Apache-2.0"
repository = "https://git.lionos.org/lion-greeter"
publish = false

[lib]
name = "lion_greeter"
path = "src/lib.rs"

[[bin]]
name = "lion-greeter"
path = "src/main.rs"

[features]
default = ["real-pam", "real-logind"]
# dlopen(3)-based libpam backend + privileged launcher. Audited unsafe FFI lives in
# `lion_greeter::pam::sys` and `lion_greeter::sysffi` only; every other module is
# `#![forbid(unsafe_code)]`.
real-pam = []
# zbus calls to org.freedesktop.login1 (session registration, power actions).
real-logind = ["dep:zbus"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
libc = "0.2"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"], optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "greeter_client"
path = "examples/greeter_client.rs"

[[bench]]
name = "lion_bench"
path = "benches/lion_bench.rs"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.bench]
debug = true
