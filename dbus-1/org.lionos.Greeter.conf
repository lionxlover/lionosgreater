<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root owns the name; only the login UI's account may call
       it; everyone else is denied everything (defense in depth: the
       default context is also explicit so a future policy tweak can't
       accidentally open it up). -->

  <policy user="root">
    <allow own="org.lionos.Greeter"/>
    <!-- root may also send to itself for self-tests. -->
    <allow send_destination="org.lionos.Greeter"/>
    <allow receive_sender="org.lionos.Greeter"/>
  </policy>

  <policy user="lion-login">
    <allow send_destination="org.lionos.Greeter"/>
    <allow receive_sender="org.lionos.Greeter"/>
  </policy>

  <policy context="default">
    <deny own="org.lionos.Greeter"/>
    <deny send_destination="org.lionos.Greeter"/>
    <deny receive_sender="org.lionos.Greeter"/>
  </policy>

</busconfig>
