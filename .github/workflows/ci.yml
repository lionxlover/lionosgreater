# CI for lion-greeter (spec 01 §10, §13.4).
#
# Gates: fmt, clippy -D warnings, tests, coverage ≥80% on core logic,
# cargo-deny, cargo-audit, a short fuzz pass, the bench regression
# check, and the systemd-nspawn integration job (real PAM + logind).

name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # real-PAM smoke test needs libpam present (dlopen'd at runtime)
      - run: sudo apt-get update && sudo apt-get install -y libpam0g
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
        name: tests without real backends (mocks only)

  coverage:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: sudo apt-get update && sudo apt-get install -y libpam0g
      # Core logic (everything except the two audited FFI modules and the
      # real-logind D-Bus path) must stay above 80% (spec §10).
      - run: |
          cargo llvm-cov --locked --summary-only \
            --ignore-fn-name 'pam::sys' \
            --ignore-fn-name 'sysffi' \
            --ignore-fn-name 'logind.*Real' \
            --fail-under-lines 80

  deny-and-audit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings

  fuzz:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      # Short pass over the protocol parser boundary; corpus in-tree.
      - run: cargo fuzz run protocol -- -runs=20000 -max_total_time=120
        working-directory: fuzz
      - run: cargo fuzz fmt corpus protocol || true
        working-directory: fuzz

  bench:
    # Performance targets (spec §7): fail CI on >10% regression.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --locked -- --json > bench.json
      - run: python3 packaging/ci/bench-check.py bench.json
        name: enforce perf budgets (+10% tolerance)

  nspawn-integration:
    # Real PAM stack + real logind in a systemd-nspawn container (spec §10).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: sudo packaging/ci/integration/nspawn-run.sh target/release/lion-greeter
